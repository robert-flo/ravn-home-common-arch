name: Package from vendored source

# Empaquetado y publicación del .pkg de ravn-home-common (issue #9), con el
# patrón que ya funciona en pj-domina-rf-git-setup-arch y en
# ravn-trio-arch. La particularidad de este repo: ravn-home-common es un
# repo privado, así que el tarball vendoreado ES la fuente (la URL del
# archive del tag da 404 sin credenciales); no hay checkout de otro repo
# ni derivación de versión: makepkg construye el PKGBUILD tal cual (la
# versión vive en el PKGBUILD y sube con cada release), el .pkg se prueba
# instalado y, en repository_dispatch, entra al canal stable de
# omarchy-personal-repo con el toolkit de omarchy-pkgs (bin/publish-artifact
# contra un remote rclone local, el mismo patrón de release-personal.yml).
# workflow_dispatch permite repetirlo a mano: construye e instala pero NO
# publica.

on:
  repository_dispatch:
    types:
      - source-updated
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  package:
    name: Build, install-test and publish the package
    # Dos dispatches no deben pisarse el push a gh-pages: la fila
    # serializa los runs del repo.
    concurrency:
      group: package-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      # Primer paso: archlinux:base no trae git, y sin git actions/checkout
      # cae al fallback REST que baja el arbol sin historial (lección del
      # primer run real del repo del patrón).
      - name: Install build and runtime dependencies
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm base-devel git github-cli gnupg openssh

      - name: Checkout this package repository
        uses: actions/checkout@v4

      - name: Stage the build directory
        env:
          PKG_BUILD: ${{ github.workspace }}/build
        run: |
          set -euo pipefail

          # El tarball vendoreado es la fuente: exactamente uno, y el
          # PKGBUILD debe declararlo (un release viejo olvidado se nota acá,
          # no en makepkg).
          tarballs=( ravn-home-common-*.tar.gz )
          if (( ${#tarballs[@]} != 1 )) || [[ ! -e "${tarballs[0]}" ]]; then
            echo "no quedó exactamente un tarball vendoreado en la raíz del repo" >&2
            exit 1
          fi
          # El PKGBUILD declara el source parametrizado
          # ("${pkgname}-${pkgver}.tar.gz"): la guardia deriva el nombre
          # esperado de pkgver, no de un literal.
          pkgver="$(awk -F= '/^pkgver=/{print $2; exit}' PKGBUILD)"
          [[ "${tarballs[0]}" == "ravn-home-common-${pkgver}.tar.gz" ]] || {
            echo "el tarball vendoreado no coincide con pkgver del PKGBUILD: ${tarballs[0]} vs ravn-home-common-${pkgver}.tar.gz" >&2
            exit 1
          }

          mkdir -p "${PKG_BUILD}"
          cp PKGBUILD "${tarballs[0]}" "${PKG_BUILD}/"

      - name: Build the package and install-test it
        id: build
        env:
          PKG_BUILD: ${{ github.workspace }}/build
        run: |
          set -euo pipefail

          useradd --create-home builder
          chown -R builder:builder "${PKG_BUILD}"
          # depends=('bash') se resuelve en el contenedor: makepkg con el
          # chequeo de dependencias normal (el sha256 del tarball vendoreado
          # lo valida el propio makepkg).
          ( cd "${PKG_BUILD}" && su builder -c "makepkg" )

          pkg_files=( "${PKG_BUILD}"/ravn-home-common-*.pkg.tar.zst )
          if (( ${#pkg_files[@]} != 1 )) || [[ ! -e "${pkg_files[0]}" ]]; then
            echo "no quedó exactamente un .pkg.tar.zst en ${PKG_BUILD}" >&2
            exit 1
          fi

          pacman -U --noconfirm "${pkg_files[0]}"

          # Smoke del payload instalado: los archivos que package() staged,
          # el paquete íntegro según pacman, y el script instalado corriendo
          # (--help y un dry-run completo, sin tocar nada).
          share=/usr/share/ravn/common
          test -f "$share/bash/rc"
          test -f "$share/fish/config.fish"
          test -f "$share/alacritty/alacritty.toml"
          test -f "$share/fcitx5/conf/classicui.conf"
          test -f "$share/gtk-3.0/settings.ini"
          test -f "$share/gtk-4.0/settings.ini"
          test -f "$share/gtk-4.0/gtk.css"
          [[ -n "$(ls -A "$share/gtk-4.0/assets")" ]]
          test -f "$share/mpv/mpv.conf"
          test -f "$share/mpv/scripts/uosc/main.lua"
          test -x "$share/bin/ravn-home-sync"
          pacman -Qkk ravn-home-common > /dev/null

          test_home=/tmp/ravn-home-package-test
          mkdir -p "$test_home"
          NO_COLOR=1 HOME="$test_home" TERM=dumb "$share/bin/ravn-home-sync" --help > /tmp/ravn-home-help-output
          grep -Fq 'Uso' /tmp/ravn-home-help-output
          HOME="$test_home" "$share/bin/ravn-home-sync" -n -t "$test_home" -s "$share" > /tmp/ravn-home-dryrun-output
          grep -Fq 'DRY-RUN' /tmp/ravn-home-dryrun-output
          grep -Fq 'completado' /tmp/ravn-home-dryrun-output

          pkgver="$(bsdtar -xOf "${pkg_files[0]}" .PKGINFO | awk -F' = ' '$1=="pkgver"{print $2; exit}')"
          printf 'versión construida: %s\n' "$pkgver"
          {
            printf 'pkgver=%s\n' "$pkgver"
          } >> "${GITHUB_OUTPUT}"
          echo "instalación verificada: payload en $share y ravn-home-sync corriendo"

      - name: Upload the package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravn-home-common-${{ steps.build.outputs.pkgver }}
          path: build/*.pkg.tar.zst
          if-no-files-found: error


      # Opción A: la publicación a gh-pages la centraliza robert-flo/omarchy-personal-repo
      # (release.yml + sync-arch-pkgbuilds.yml). Este repo solo construye y valida el .pkg.
